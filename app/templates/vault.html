{% extends 'base.html' %}

{% block title %}Vault: Items Table{% endblock %}

{% block content %}
<h1>Vault: Items Table</h1>

<div class="mb-3">
    <a href="{{ url_for('vault.new_item') }}" class="btn btn-success">Create New Item</a>
    <a href="{{ url_for('vault.new_folder') }}" class="btn btn-info">Create New Folder</a>
    <a href="{{ url_for('vault.password_generator') }}" class="btn btn-warning">Generate Password</a>
</div>

<style>
    .button-container button {
        width: 100%; /* Set equal width for all buttons */
    }
</style>

<div class="left-pane">
    <h3>Folders</h3>
    <ul>
        {% for folder in folders %}
                <li><a href="{{ url_for('vault.view_folder', folder_id=folder[1], folder_name=folder[0]) }}">{{ folder[0] }}</a></li>
        {% endfor %}
    </ul>
</div>
{% include 'item-table.html' %}

{% endblock %}
